plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    // Cloth Config
    compileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"

    // Triggers
    compileOnly "maven.modrinth:triggers:${triggers_version}-forge"

    implementation 'net.jodah:typetools:0.6.3'
    compileOnly 'org.jetbrains:annotations:26.0.2-1'
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.6'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// Exercise the reward panel against mapped Minecraft classes without launching a game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
tasks.register('verifyRewardOverview', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.infernalstudios.questlog.RewardOverviewVerification'
    workingDir = layout.buildDirectory.dir('verification').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn 'verifyRewardOverview' }

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.srcDirs.each { dir ->
        commonResources dir
    }
}

tasks.named('test') { failOnNoDiscoveredTests = false }
