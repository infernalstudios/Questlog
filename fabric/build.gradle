plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        url = 'https://maven.cafeteria.dev'
    }
    maven {
        url = 'https://maven.jamieswhiteshirt.com/libs-release'
    }
    maven {
        url = 'https://jitpack.io'
    }
    maven {
        name = 'QuiltMC'
        url = 'https://maven.quiltmc.org/repository/release'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // EMI
    modRuntimeOnly "dev.emi:emi-fabric:${emi_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    // Triggers
    modImplementation "maven.modrinth:triggers:${triggers_version}-fabric"
    include "maven.modrinth:triggers:${triggers_version}-fabric"

    // Origins
    modImplementation "maven.modrinth:origins:${origins_fabric_version}"
    modImplementation "io.github.apace100:apoli:2.12.0-pre.2+mc.1.21.1"
    modImplementation "io.github.apace100:calio:1.14.0-alpha.9"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:6.1.3"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:6.1.3"

    implementation 'net.jodah:typetools:0.6.3'
    include 'net.jodah:typetools:0.6.3'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
}